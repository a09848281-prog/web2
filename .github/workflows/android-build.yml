name: Android APK Build
on:
  push:
    branches: [main, "preview/v2.0-stability", "preview/v2.0.1-location-rtc", "preview/v2.1.0-stability", "preview/v2.1.2-stability", "preview/v2.5-remote-screen", "preview/v2.6-stability", "preview/v2.6.1-stability", "preview/v2.7-auto-recovery", "preview/v2.7.1-fixes", "preview/v2.8.0-stable-reconnect", "preview/v2.8.3-fps-reconnect-stability", "preview/v2.8.4-battery-pairing-layout-stability", "preview/v2.8.5-reconnect-watchdog", "preview/v2.8.6-lockscreen-camera-battery", "preview/v2.8.8-cloudflare-turn-ice", "preview/v2.8.9-ipv6-ice-diagnostics", "preview/v2.8.9-ipv6-stun-only"]
  pull_request:
    branches: [main, "preview/v2.0-stability", "preview/v2.1.0-stability", "preview/v2.5-remote-screen", "preview/v2.6-stability", "preview/v2.6.1-stability", "preview/v2.7-auto-recovery", "preview/v2.7.1-fixes", "preview/v2.8.0-stable-reconnect"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript and GAS syntax
        run: |
          node --check app.js
          node --check motion-core.js
          node --check audio-utils.js
          node --check noise-suppressor-processor.js
          node --check location-utils.js
          node --check recovery-core.js
          node --check network-ice.js
          node --check sw.js
          node --check < gas/Code.gs
          node --test tests/*.test.cjs
          node scripts/check-project.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: remote-camera-web2-preview-v2.8.6-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
