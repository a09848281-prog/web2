name: Android APK Build
on:
  push:
    branches: [main, "preview/v2.0-stability"]
  pull_request:
    branches: [main, "preview/v2.0-stability"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript and GAS syntax
        run: |
          node --check app.js
          node --check motion-core.js
          node --check audio-utils.js
          node --check < gas/Code.gs
          node --test tests/*.test.cjs
          node scripts/check-project.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: remote-camera-web2-preview-v2.0-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
