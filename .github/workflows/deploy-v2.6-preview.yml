name: Deploy Remote Camera Web2 Previews to GitHub Pages

on:
  push:
    branches:
      - preview/v2.6-stability
      - preview/v2.6.1-stability
      - preview/v2.7-auto-recovery
      - preview/v2.7.1-fixes
      - preview/v2.8.0-stable-reconnect
      - preview/v2.8.1-web-style-preserved
      - preview/v2.8.2-command-stability
      - preview/v2.8.3-fps-reconnect-stability
      - preview/v2.8.4-battery-pairing-layout-stability
      - preview/v2.8.5-reconnect-watchdog
      - preview/v2.8.6-lockscreen-camera-battery
      - preview/v2.8.10-expressturn-stability
    paths:
      - "index.html"
      - "app.js"
      - "app.css"
      - "location-utils.js"
      - "audio-utils.js"
      - "motion-core.js"
      - "gas/**"
      - "manifest.webmanifest"
      - "sw.js"
      - "config.json"
      - "icon.svg"
      - "noise-suppressor-processor.js"
      - "recovery-core.js"
      - "V2.7-AUTO-RECOVERY.md"
      - "V2.7.1-FIXES.md"
      - "V2.8.0-STABLE-RECOVERY.md"
      - "V2.8.1-WEB-STYLE-PRESERVED.md"
      - "V2.8.2-COMMAND-STABILITY.md"
      - "V2.8.3-FPS-RECONNECT-STABILITY.md"
      - "V2.8.4-BATTERY-PAIRING-LAYOUT-STABILITY.md"
      - "V2.8.5-RECONNECT-WATCHDOG.md"
      - "V2.8.6-LOCKSCREEN-CAMERA-BATTERY.md"
      - "android/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/deploy-v2.6-preview.yml"
      - "V2.6-STABILITY.md"
      - "V2.6.1-STABILITY.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-v2.6-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published homepage (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: base-site
      - name: Checkout existing v2.1.2 preview
        uses: actions/checkout@v4
        with:
          ref: preview/v2.1.2-stability
          path: v21-source
      - name: Checkout existing v2.5 preview
        uses: actions/checkout@v4
        with:
          ref: preview/v2.5-remote-screen
          path: v25-source
      - name: Checkout v2.6 stability preview
        uses: actions/checkout@v4
        with:
          ref: preview/v2.6-stability
          path: v26-source
      - name: Checkout v2.6.1 stability preview
        uses: actions/checkout@v4
        with:
          ref: preview/v2.6.1-stability
          path: v261-source
      - name: Checkout v2.7 automatic recovery preview
        uses: actions/checkout@v4
        with:
          ref: preview/v2.7-auto-recovery
          path: v27-source
      - name: Checkout v2.7.1 fixes preview
        uses: actions/checkout@v4
        with:
          ref: preview/v2.7.1-fixes
          path: v271-source
      - name: Checkout v2.8.0 stable reconnect preview
        uses: actions/checkout@v4
        with:
          ref: preview/v2.8.0-stable-reconnect
          path: v280-source
      - name: Checkout v2.8.1 Web style preserved preview
        uses: actions/checkout@v4
        with:
          ref: preview/v2.8.1-web-style-preserved
          path: v281-source
      - name: Checkout v2.8.2 command stability preview
        uses: actions/checkout@v4
        with:
          ref: preview/v2.8.2-command-stability
          path: v282-source
      - name: Checkout v2.8.3 FPS and reconnect stability preview
        uses: actions/checkout@v4
        with:
          ref: preview/v2.8.3-fps-reconnect-stability
          path: v283-source
      - name: Checkout v2.8.4 battery, pairing and layout stability preview
        uses: actions/checkout@v4
        with:
          ref: preview/v2.8.4-battery-pairing-layout-stability
          path: v284-source
      - name: Checkout v2.8.5 reconnect watchdog preview
        uses: actions/checkout@v4
        with:
          ref: preview/v2.8.5-reconnect-watchdog
          path: v285-source
      - name: Checkout v2.8.6 lock-screen and battery preview
        uses: actions/checkout@v4
        with:
          ref: preview/v2.8.6-lockscreen-camera-battery
          path: v286-source
      - name: Checkout v2.8.10 ExpressTURN stability preview
        uses: actions/checkout@v4
        with:
          ref: preview/v2.8.10-expressturn-stability
          path: v2810-source
      - name: Run JavaScript regression and project checks
        working-directory: v2810-source
        run: |
          node --check app.js
          node --check recovery-core.js
          node --test tests/*.test.cjs
          node scripts/check-project.mjs
      - name: Assemble site without replacing the homepage
        run: |
          mkdir -p _site/v2.1 _site/v2.5 _site/v2.6 _site/v2.6.1 _site/v2.7 _site/v2.7.1 _site/v2.8.0 _site/v2.8.1 _site/v2.8.2 _site/v2.8.3 _site/v2.8.4 _site/v2.8.5 _site/v2.8.6 _site/v2.8.10
          rsync -a --exclude='.git' base-site/ _site/
          rsync -a --exclude='.git' --exclude='.github' v21-source/ _site/v2.1/
          rsync -a --exclude='.git' --exclude='.github' v25-source/ _site/v2.5/
          rsync -a --exclude='.git' --exclude='.github' v26-source/ _site/v2.6/
          rsync -a --exclude='.git' --exclude='.github' v261-source/ _site/v2.6.1/
          rsync -a --exclude='.git' --exclude='.github' v27-source/ _site/v2.7/
          rsync -a --exclude='.git' --exclude='.github' v271-source/ _site/v2.7.1/
          rsync -a --exclude='.git' --exclude='.github' v280-source/ _site/v2.8.0/
          rsync -a --exclude='.git' --exclude='.github' v281-source/ _site/v2.8.1/
          rsync -a --exclude='.git' --exclude='.github' v282-source/ _site/v2.8.2/
          rsync -a --exclude='.git' --exclude='.github' v283-source/ _site/v2.8.3/
          rsync -a --exclude='.git' --exclude='.github' v284-source/ _site/v2.8.4/
          rsync -a --exclude='.git' --exclude='.github' v285-source/ _site/v2.8.5/
          rsync -a --exclude='.git' --exclude='.github' v286-source/ _site/v2.8.6/
          rsync -a --exclude='.git' --exclude='.github' v2810-source/ _site/v2.8.10/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: _site
      - name: Deploy versioned previews including v2.8.10 ExpressTURN
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
