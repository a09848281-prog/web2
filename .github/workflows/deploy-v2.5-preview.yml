name: Deploy v2.5 Preview to GitHub Pages

on:
  push:
    branches:
      - preview/v2.5-remote-screen
    paths:
      - "index.html"
      - "app.js"
      - "app.css"
      - "remote-screen-utils.js"
      - "location-utils.js"
      - "audio-utils.js"
      - "motion-core.js"
      - "gas/**"
      - "manifest.webmanifest"
      - "sw.js"
      - "config.json"
      - ".github/workflows/deploy-v2.5-preview.yml"
      - "V2.5-REMOTE-SCREEN.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-v2.5-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published homepage (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: base-site
      - name: Checkout existing v2.1.2 preview
        uses: actions/checkout@v4
        with:
          ref: preview/v2.1.2-stability
          path: v21-source
      - name: Checkout v2.5 preview source
        uses: actions/checkout@v4
        with:
          ref: preview/v2.5-remote-screen
          path: v25-source
      - name: Assemble site without replacing the homepage
        run: |
          mkdir -p _site/v2.1 _site/v2.5
          rsync -a --exclude='.git' base-site/ _site/
          rsync -a --exclude='.git' --exclude='.github' v21-source/ _site/v2.1/
          rsync -a --exclude='.git' --exclude='.github' v25-source/ _site/v2.5/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy v2.1 and v2.5 previews
        id: deployment
        uses: actions/deploy-pages@v4
